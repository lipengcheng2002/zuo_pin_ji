name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: 电商智能推荐

jobs:
  web:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SITE_URL: "https://zhiyan.example.com"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 电商智能推荐/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Tailwind source list is in sync
        run: git diff --exit-code src/app/globals.css

  agent-quality:
    name: Agent quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 电商智能推荐/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - name: Agent tests and evaluation thresholds
        run: npm run test:agent
      - name: Verbose evaluation baseline
        run: npm run eval:agent

  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SITE_URL: "http://127.0.0.1:3000"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 电商智能推荐/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start production server
        run: |
          npm start > /tmp/zhiyan-server.log 2>&1 &
          echo $! > /tmp/zhiyan-server.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/api/health > /dev/null; then break; fi
            sleep 2
          done
          curl -sf http://127.0.0.1:3000/api/health
      - run: npm run test:e2e
        env:
          E2E_BASE_URL: "http://127.0.0.1:3000"
      - name: Server logs on failure
        if: failure()
        run: cat /tmp/zhiyan-server.log

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: 电商智能推荐
          push: false
          tags: zhiyan-commerce:ci
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://zhiyan.example.com

  ml-syntax:
    name: Offline pipeline syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m compileall -q ml
      - name: Generate reproducible artifact
        run: python ml/scripts/simulate_pipeline.py
